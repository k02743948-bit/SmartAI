                  <div className="max-w-5xl mx-auto space-y-6">
                    <div className="p-6 rounded-3xl glass-panel border border-white/5">
                      <h2 className="text-xl font-bold text-white">Coding Assistant & Debugger</h2>
                      <p className="text-xs text-slate-400">Generate, debug, and optimize TypeScript and Python code.</p>
                    </div>
                    <div className="p-6 rounded-3xl glass-panel border border-white/5 space-y-4">
                      <textarea
                        id="code-prompt"
                        defaultValue="Write an asynchronous token-bucket rate limiter class in TypeScript with tests."
                        rows={4}
                        className="w-full p-3 rounded-2xl bg-slate-950 border border-slate-700 text-xs text-cyan-200 font-mono"
                      />
                      <button
                        onClick={() => {
                          const p = document.getElementById('code-prompt').value;
                          handleSendMessage(`[Coding Assistant Task]: ${p}`);
                          setCurrentView('chat');
                        }}
                        className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 font-bold text-xs text-white"
                      >
                        Execute in Code Stream
                      </button>
                    </div>
                  </div>
                )}

                {/* 7. MULTI-TOOL WORKSPACE */}
                {currentView === 'workspace' && (
                  <div className="max-w-6xl mx-auto space-y-4">
                    <div className="flex items-center gap-2">
                      {workspaceTabs.map((tab) => (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTabId(tab.id)}
                          className={`px-4 py-2 rounded-2xl text-xs font-semibold ${
                            activeTabId === tab.id ? 'bg-indigo-600 text-white' : 'glass-panel text-slate-400'
                          }`}
                        >
                          {tab.title}
                        </button>
                      ))}
                    </div>
                    <div className="p-6 rounded-3xl glass-panel border border-white/5">
                      <textarea
                        value={activeTab.content}
                        onChange={(e) => {
                          const val = e.target.value;
                          setWorkspaceTabs((prev) => prev.map((t) => t.id === activeTabId ? { ...t, content: val } : t));
                        }}
                        rows={16}
                        className="w-full bg-[#050816] p-4 rounded-2xl border border-slate-800 text-xs text-slate-200 font-mono focus:outline-none"
                      />
                    </div>
                  </div>
                )}

                {/* 8. PERSONAL MEMORY VIEW */}
                {currentView === 'memory' && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    <div className="p-6 rounded-3xl glass-panel border border-white/5 flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-white">Smart Personal Memory</h2>
                        <p className="text-xs text-slate-400">Explicitly approved context injected into all answers.</p>
                      </div>
                    </div>
                    <div className="space-y-3">
                      {memories.map((m) => (
                        <div key={m.id} className="p-4 rounded-2xl glass-panel border border-white/5 flex items-center justify-between">
                          <span className="text-xs text-slate-200 font-medium">"{m.content}"</span>
                          <button
                            onClick={() => {
                              setMemories((prev) => prev.filter((item) => item.id !== m.id));
                              showToast('Memory removed', 'info');
                            }}
                            className="text-xs text-rose-400 hover:underline"
                          >
                            Remove
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 9. PRICING & UPGRADE VIEW */}
                {currentView === 'pricing' && (
                  <div className="max-w-5xl mx-auto space-y-6">
                    <div className="text-center space-y-2">
                      <h2 className="text-3xl font-extrabold text-white">SmartAI Subscriptions</h2>
                      <p className="text-xs text-slate-400">Transparent daily usage tiers with zero hidden rate-limiting.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {[
                        { tier: 'free', price: '$0', limit: '25 requests/day', features: ['Standard AI Chat', 'Basic Writing Tools'] },
                        { tier: 'pro', price: '$19/mo', limit: '250 requests/day', features: ['Voice Assistant', 'Multi-Tool Workspace', 'Smart Memory Sync'], active: userTier === 'pro' },
                        { tier: 'ultra', price: '$49/mo', limit: '1,000 requests/day', features: ['Document Intelligence', 'Priority Processing', 'VIP Concierge'], active: userTier === 'ultra' },
                      ].map((t) => (
                        <div key={t.tier} className="p-6 rounded-3xl glass-panel border border-white/10 space-y-4">
                          <h3 className="text-lg font-bold text-white uppercase">{t.tier}</h3>
                          <div className="text-3xl font-extrabold text-cyan-300">{t.price}</div>
                          <div className="text-xs text-slate-400">{t.limit}</div>
                          <ul className="text-xs space-y-2 text-slate-300">
                            {t.features.map((f, i) => <li key={i}>✓ {f}</li>)}
                          </ul>
                          <button
                            onClick={() => {
                              setUserTier(t.tier);
                              setDailyUsage({ used: 0, limit: t.tier === 'ultra' ? 1000 : t.tier === 'pro' ? 250 : 25 });
                              if (window.confetti) window.confetti();
                              showToast(`Subscribed to SmartAI ${t.tier.toUpperCase()}!`, 'success');
                            }}
                            className="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 font-bold text-xs text-white"
                          >
                            {userTier === t.tier ? 'Current Plan' : 'Select Plan'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 10. ADMIN DASHBOARD VIEW */}
                {currentView === 'admin' && (
                  <div className="max-w-5xl mx-auto space-y-6">
                    <div className="p-6 rounded-3xl glass-panel border border-amber-500/30">
                      <h2 className="text-xl font-bold text-white">Administrator Control Panel</h2>
                      <p className="text-xs text-slate-400">Total users: 1,420 · MRR: $24,850 · Pipeline Health: 99.92%</p>
                    </div>
                    <div className="p-6 rounded-3xl glass-panel border border-white/5 space-y-2 text-xs">
                      <div className="flex justify-between py-2 border-b border-white/5">
                        <span className="font-semibold text-white">Sarah Chen</span>
                        <span className="text-cyan-300">PRO TIER · 42/250 used</span>
                      </div>
                      <div className="flex justify-between py-2 border-b border-white/5">
                        <span className="font-semibold text-white">David Kim</span>
                        <span className="text-amber-300">ULTRA TIER · 492/1000 used</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* 11. SETTINGS VIEW */}
                {currentView === 'settings' && (
                  <div className="max-w-3xl mx-auto rounded-3xl glass-panel border border-white/5 p-6 space-y-6">
                    <h2 className="text-xl font-bold text-white">Settings</h2>
                    <div className="space-y-4 text-xs">
                      <div>
                        <label className="text-slate-400 block mb-1">AI Personality</label>
                        <select
                          value={personality}
                          onChange={(e) => { setPersonality(e.target.value); showToast(`Personality updated: ${e.target.value}`, 'success'); }}
                          className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white"
                        >
                          <option value="friendly">Friendly & Approachable</option>
                          <option value="professional">Professional & Executive</option>
                          <option value="concise">Ultra-Concise & High-Signal</option>
                          <option value="creative">Creative & Imaginative</option>
                        </select>
                      </div>

                      <div className="pt-4 border-t border-white/5 flex gap-3">
                        <button onClick={handleDownloadSingleFile} className="px-4 py-2 rounded-xl bg-cyan-600 font-bold text-white">
                          Export Single-File index.html
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* User Switcher Modal */}
            {isAuthModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div onClick={() => setIsAuthModalOpen(false)} className="fixed inset-0 bg-black/70 backdrop-blur-sm" />
                <div className="relative p-6 rounded-3xl glass-panel bg-[#090d20] border border-white/10 w-full max-w-sm space-y-4">
                  <h3 className="text-base font-bold text-white">Switch Profile Role</h3>
                  <div className="space-y-2">
                    <button
                      onClick={() => { setUserRole('user'); setIsAuthModalOpen(false); showToast('Switched to Sarah Chen (Pro)', 'success'); }}
                      className="w-full p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-left text-xs font-semibold text-white border border-slate-700"
                    >
                      Sarah Chen (Pro User)
                    </button>
                    <button
                      onClick={() => { setUserRole('admin'); setIsAuthModalOpen(false); showToast('Switched to Alex Mercer (Admin)', 'success'); }}
                      className="w-full p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-left text-xs font-semibold text-white border border-slate-700"
                    >
                      Alex Mercer (System Administrator)
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Notification Toasts */}
            <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none">
              {toasts.map((t) => (
                <div key={t.id} className="p-3.5 rounded-2xl glass-panel border border-cyan-500/40 text-xs text-white shadow-2xl pointer-events-auto">
                  {t.message}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // Mount to root DOM
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<SmartAIApp />);
      }
    </script>

    <!-- Fallback Vite dev entry point so full-stack compilation remains 100% active -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
